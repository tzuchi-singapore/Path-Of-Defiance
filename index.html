<title>仙逆·逆天路 · Path of Defiance</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#05030c;touch-action:none;font-family:"PingFang SC","Noto Serif SC","Songti SC","Microsoft YaHei",serif;color:#f6ecd2}
canvas{position:fixed;inset:0;display:block}
#hud{pointer-events:none;z-index:2}
#touch{position:fixed;inset:0;z-index:3;display:none;touch-action:none}
.scr{position:fixed;inset:0;z-index:5;display:none;pointer-events:none}
.scr.show{display:block}
.scr>*{pointer-events:auto}
.gold{background:linear-gradient(180deg,#fff3c0,#e0a030 55%,#8a4a10);color:#3a1406;border:2px solid #fff3c0;text-shadow:0 1px 0 #fff0b0}
button{font:inherit;cursor:pointer}
.btn{font-weight:900;letter-spacing:.1em;border-radius:999px;padding:9px 20px;font-size:15px;border:2px solid #e9c46a;color:#fff4d6;background:linear-gradient(180deg,rgba(70,40,100,.92),rgba(20,10,40,.95));box-shadow:0 0 0 2px rgba(0,0,0,.4),0 0 14px rgba(233,196,106,.3)}
.btn.gold{border-color:#fff3c0;color:#3a1406;background:linear-gradient(180deg,#fff0b0,#dc982a 60%,#8a4a10)}
.btn:active{transform:scale(.95)}
.btn:disabled{filter:grayscale(1) brightness(.6)}
.panel{background:linear-gradient(180deg,rgba(28,18,48,.88),rgba(10,6,22,.92));border:1.5px solid rgba(233,196,106,.6);border-radius:14px;box-shadow:0 0 22px rgba(0,0,0,.5),inset 0 0 18px rgba(233,196,106,.08)}
/* loading */
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 40%,#2a1640,#05030c)}
.logo{font-size:clamp(40px,10vh,84px);font-weight:900;letter-spacing:.14em;background:linear-gradient(180deg,#fff8dc 10%,#f3c75a 55%,#a8661a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #3a1406) drop-shadow(0 0 20px rgba(255,190,80,.5))}
.logoSub{letter-spacing:.4em;color:#bfe6ff;font-size:clamp(11px,2.2vh,15px);text-shadow:0 0 10px #39a0ff}
.lbar{width:min(60vw,420px);height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;border:1px solid rgba(233,196,106,.5)}
.lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a4a10,#ffe08a)}
#loadTxt{font-size:13px;opacity:.8}
#btnEnter{display:none}
/* hub */
#hubTop{position:absolute;top:max(8px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#hubTop>*{pointer-events:auto}
.res{display:flex;gap:8px}
.chip{background:rgba(10,6,22,.75);border:1px solid rgba(233,196,106,.6);border-radius:999px;padding:4px 12px 4px 6px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.chip b{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8fff4,#2ac4a0 60%,#0a5a48);box-shadow:0 0 8px #2affc8}
#hubInfo{position:absolute;left:12px;top:56px;width:min(300px,34vw);padding:12px 14px}
.realmRow{display:flex;gap:10px;align-items:center}
.realmRow img{width:58px;height:58px;filter:drop-shadow(0 0 8px rgba(255,210,120,.6))}
.realmName{font-size:24px;font-weight:900;color:#ffe08a;text-shadow:0 0 10px rgba(255,170,60,.6)}
.realmSub{font-size:12px;color:#bfe6ff;letter-spacing:.1em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:10px;font-size:13px}
.stats span{color:#c9b48a}.stats b{color:#fff}
.gear{margin-top:10px;font-size:12px;line-height:1.7;border-top:1px solid rgba(233,196,106,.25);padding-top:6px}
.gear .g{color:#ffd36a}
#hubBtns{position:absolute;right:12px;top:56px;display:flex;flex-direction:column;gap:9px;width:min(220px,28vw)}
#hubBtns .btn{width:100%;text-align:left;display:flex;align-items:center;gap:8px;font-size:14px;padding:8px 14px}
#hubBtns .btn img{width:30px;height:30px}
.dot{margin-left:auto;min-width:18px;height:18px;border-radius:9px;background:#ff3a4a;color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 4px;box-shadow:0 0 8px #ff3a4a}
.sk.jump{background:radial-gradient(circle at 35% 30%,#e0fff4,#1f7a6a)}
.intro{margin:6px auto;max-width:520px;font-size:13px;color:#ffe9b0;line-height:1.5}
.sprow{margin-top:6px;font-size:14px}.sprow b{color:#ffe08a;font-size:18px}.sprow small{opacity:.6}
.slots{display:flex;gap:8px;justify-content:center;margin:10px 0 6px}
.slot{width:54px;height:54px;border-radius:50%;border:2px solid #e9c46a;background:#1a1030;position:relative;display:flex;align-items:center;justify-content:center;font-size:11px;color:#bbb;overflow:hidden;cursor:pointer}
.slot img{width:100%;height:100%}.slot b{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.65);font-size:10px;color:#fff}
.slot.lock{opacity:.45;border-style:dashed}.slot.sel{box-shadow:0 0 0 3px #fff,0 0 14px #ffe08a}
.eltabs{display:flex;gap:6px;justify-content:center;margin:6px 0}
.eltab{display:flex;align-items:center;gap:4px;padding:4px 12px 4px 4px;border-radius:999px;border:2px solid rgba(255,255,255,.2);background:rgba(20,12,40,.8);color:#fff;font-weight:900;font-size:15px}
.eltab img{width:30px;height:30px}.eltab.on{border-color:var(--c);box-shadow:0 0 12px var(--c);color:var(--c)}
.cards{display:flex;flex-direction:column;gap:8px;text-align:left;max-width:620px;margin:0 auto}
.skcard{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(233,196,106,.25)}
.skcard>img{width:62px;height:62px;flex:none}.skcard.locked{opacity:.5}.skcard.locked>img{filter:grayscale(1)}
.skinfo{flex:1;min-width:0}.skinfo .nm{font-weight:900;font-size:16px;color:#fff4d6}.skinfo .nm small{opacity:.6;font-weight:600;font-size:11px}
.skinfo .lvl{font-size:12px;color:#ffe08a;margin:2px 0}.skinfo .ds{font-size:12px;opacity:.85}.skinfo .ds.nx{color:#9fffe0;opacity:.8}
.skbtns{display:flex;flex-direction:column;gap:5px;flex:none}.btn.sm{padding:5px 12px;font-size:12px;letter-spacing:.05em}.maxed{color:#ffe08a;font-weight:900;font-size:13px;text-align:center}
.ctr{margin-top:8px;font-size:12px;opacity:.85}
#btnBreak.ready{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px rgba(0,0,0,.4),0 0 30px rgba(255,220,100,.95)}}
#hubBottom{position:absolute;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(620px,72vw);text-align:center}
.expWrap{font-size:13px;margin-bottom:4px;text-shadow:0 1px 2px #000}
.expbar{height:14px;border-radius:8px;background:rgba(0,0,0,.6);border:1px solid rgba(233,196,106,.7);overflow:hidden;position:relative}
.expbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#6a3aff,#c9a0ff,#fff0c0);transition:width .4s}
#hubNext{position:absolute;right:calc(min(220px,28vw) + 24px);bottom:70px;width:110px;text-align:center;font-size:11px;color:#e8dcc0}
#hubNext img{width:100%;filter:drop-shadow(0 0 10px rgba(0,0,0,.8)) brightness(.35) saturate(0);border-radius:8px}
#hubNext.show img{filter:drop-shadow(0 0 14px rgba(255,220,120,.9))}
/* map */
#mapUI{background:radial-gradient(ellipse at 50% 30%,rgba(30,18,50,.65),rgba(5,3,12,.92))}
#mapHead{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}
#mapTitle{font-size:24px;font-weight:900;color:#ffe08a;letter-spacing:.2em}
#chapters{position:absolute;top:58px;left:12px;right:12px;bottom:12px;display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.chap{flex:0 0 min(300px,42vw);border-radius:14px;overflow:hidden;position:relative;border:2px solid rgba(233,196,106,.5);background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end}
.chap.locked{filter:grayscale(.85) brightness(.55)}
.chap .ct{position:absolute;top:0;left:0;right:0;padding:10px 12px;background:linear-gradient(180deg,rgba(0,0,0,.75),transparent)}
.chap .ct b{font-size:20px;color:#fff;text-shadow:0 2px 4px #000}.chap .ct small{display:block;font-size:11px;color:#ffe08a}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px;background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,.4))}
.st{border-radius:10px;border:1.5px solid rgba(233,196,106,.6);background:rgba(20,12,36,.85);color:#fff;padding:6px 2px;font-weight:900;font-size:14px;text-align:center}
.st small{display:block;font-size:10px;color:#ffd36a;letter-spacing:1px;min-height:12px}
.st.boss{background:linear-gradient(180deg,rgba(120,20,30,.9),rgba(40,6,12,.9));border-color:#ff8a6a}
.st:disabled{opacity:.35}
.st .sw{display:block;margin-top:3px;font-size:10px;color:#8fd8ff;border-top:1px solid rgba(255,255,255,.15);padding-top:2px}
/* battle */
#bTop{position:absolute;top:max(6px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#bTop>*{pointer-events:auto}
.pcard{display:flex;gap:8px;align-items:center;padding:5px 10px 5px 5px;border-radius:40px;background:rgba(10,6,22,.7);border:1px solid rgba(233,196,106,.55)}
.pcard .av{width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid #e9c46a;background:#2a1a40}
.pcard .av img{width:100%;height:170%;object-fit:cover;object-position:50% 0}
.pname{font-size:13px;font-weight:900}
.hp{width:min(200px,24vw);height:11px;border-radius:6px;background:rgba(0,0,0,.6);border:1px solid rgba(233,196,106,.6);overflow:hidden;position:relative;margin-top:3px}
.hp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#8aff9a,#1a9a3a)}
.hp span{position:absolute;inset:0;font-size:9px;line-height:11px;text-align:center;font-family:sans-serif;font-weight:800}
.hp.exp{height:5px;margin-top:3px}.hp.exp i{background:linear-gradient(90deg,#6a3aff,#e0c0ff)}
#bStage{text-align:center;font-weight:900;text-shadow:0 2px 3px #000;font-size:15px}
#bWave{font-size:12px;color:#ffe08a;text-align:center}
.tg{display:flex;gap:6px}
.tg button{min-width:44px;height:36px;border-radius:18px;border:1.5px solid #e9c46a;background:rgba(10,6,22,.7);color:#ffe7a8;font-weight:900;font-size:13px;padding:0 8px}
.tg button.on{background:linear-gradient(180deg,#ffe08a,#c07a1a);color:#3a1406}
#bossBar{position:absolute;top:58px;left:50%;transform:translateX(-50%);width:min(520px,52vw);display:none;text-align:center}
#bossName{font-weight:900;font-size:15px;color:#ffd0a0;text-shadow:0 0 8px #f40,0 2px 2px #000}
.bb{height:14px;border-radius:7px;background:rgba(0,0,0,.65);border:1.5px solid #e9c46a;position:relative;overflow:hidden;margin-top:2px}
.bb i{position:absolute;left:0;top:0;bottom:0}
#bossLag{background:#fff;opacity:.8}#bossHp{background:linear-gradient(90deg,#ff2a3a,#ff7a2a 60%,#ffd36a)}
#skills{position:absolute;right:0;bottom:0;width:330px;height:240px;pointer-events:none}
.sk{position:absolute;width:62px;height:62px;border-radius:50%;border:2.5px solid #e9c46a;background:#1a1030 center/cover;pointer-events:auto;box-shadow:0 0 0 3px rgba(0,0,0,.45),0 0 12px rgba(0,0,0,.6);overflow:hidden;touch-action:none;padding:0}
.sk img{width:100%;height:100%;display:block;pointer-events:none}
.sk .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.72) calc(var(--p,0)*1%),transparent 0);display:flex;align-items:center;justify-content:center;font:900 18px sans-serif;color:#fff;pointer-events:none}
.sk .lk{position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#ffd36a;text-align:center;line-height:1.1;pointer-events:none}
.sk.locked .lk{display:flex}
.sk.ready{animation:skr 1.2s infinite}
@keyframes skr{50%{box-shadow:0 0 0 3px rgba(0,0,0,.45),0 0 18px rgba(255,220,120,.95)}}
.sk.atk{width:92px;height:92px;right:16px;bottom:18px}
.sk.dash{width:52px;height:52px;background:radial-gradient(circle at 35% 30%,#e8e0ff,#4a3a90);color:#fff;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center}
.sk .key{position:absolute;right:6px;top:3px;font:800 10px sans-serif;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none}
/* modal */
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(3,2,10,.62)}
#modal.show{display:flex}
#mbox{min-width:min(420px,86vw);max-width:94vw;max-height:92vh;overflow:auto;padding:18px 20px;text-align:center}
.mt{font-size:30px;font-weight:900;letter-spacing:.2em;background:linear-gradient(180deg,#fff8dc,#f3c75a 60%,#b8761a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #3a1406)}
.mrow{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.rew{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:16px;font-weight:900}
.stars{font-size:30px;color:#ffd36a;letter-spacing:6px;text-shadow:0 0 12px #f90}
.eqrow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:rgba(255,255,255,.05);margin-top:8px;text-align:left}
.eqrow img{width:46px;height:46px}
.eqrow .nm{font-weight:900;color:#ffe08a}.eqrow .ds{font-size:12px;opacity:.85}
.eqrow .btn{margin-left:auto;padding:6px 12px;font-size:13px}
.evo{display:flex;gap:8px;overflow-x:auto;padding:6px 2px}
.evo .c{flex:0 0 120px;border-radius:12px;border:1.5px solid rgba(233,196,106,.5);background:radial-gradient(ellipse at 50% 30%,rgba(90,70,150,.6),rgba(10,6,22,.9));padding:6px;font-size:12px}
.evo .c img{width:100%;height:150px;object-fit:contain}
.evo .c.lock img{filter:brightness(0) drop-shadow(0 0 6px rgba(160,140,255,.8))}
.evo .c.cur{border-color:#fff3c0;box-shadow:0 0 16px rgba(255,220,120,.8)}
.evo .c b{display:block;color:#ffe08a;font-size:15px}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:30;pointer-events:none;font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 6px #000,0 0 16px #f90;opacity:0;transition:opacity .3s}
#rotate{position:fixed;inset:0;z-index:50;background:#05030c;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-size:20px;line-height:1.8;color:#ffe08a}
</style>
</head>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {clone as skClone} from 'three/addons/utils/SkeletonUtils.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================
   仙逆 · 逆天路  —  2.5D cultivation action RPG
   Mortal → Qi Condensation → Foundation → Core → Nascent Soul → Soul Transformation → Heaven Trampler
   ===================================================================== */

/* ---------- CONFIG: drop Tripo models for each evolution here ----------
   e.g. HERO_TIER_GLB[0]='models/hero_t0.glb'  (any missing tier falls back to the base model) */
/* MODEL REGISTRY — every character is a 3D GLB (static Tripo meshes are auto-rigged in code).
   To upgrade a model: drop a new GLB at the same path. Missing boss models fall back to `fallback`. */
const MODEL_DEF={
 hero_t0:{url:'models/hero_t0.glb',rigOpt:{wpn:{side:-1,hand:[-0.2, 0.37, 0.06],tip:[-0.33, 0.1, 0.2]}},h:1.75},

let texts=[];
function addText(pos,txt,o={}){texts.push({p:pos.clone(),txt,t:0,dur:o.dur||0.9,size:o.size||22,c1:o.c1||'#fff',c2:o.c2||'#ffcf4a',vy:o.vy??1.2,ox:rand(-12,12)})}
function dmgCalc(mult,def){const s=hero.stats,crit=Math.random()<s.crit;let d=s.atk*mult*rand(0.9,1.1)*(crit?s.cdm:1)-def*0.5;return{d:Math.max(1,Math.round(d)),crit}}
const ELEM={sword:{cn:'剑',en:'Sword',col:0xeaf0ff,css:'#e6eeff',icon:'el_sword'},ice:{cn:'冰',en:'Ice',col:0x8fdcff,css:'#9fe8ff',icon:'el_ice'},fire:{cn:'火',en:'Fire',col:0xff7a2a,css:'#ffa060',icon:'el_fire'},thunder:{cn:'雷',en:'Thunder',col:0xb48aff,css:'#c9a0ff',icon:'el_thunder'}};
const FOE_EL={fire:{cn:'火',weak:'ice',css:'#ff8a4a'},ice:{cn:'冰',weak:'fire',css:'#9fe8ff'},evil:{cn:'魔',weak:'thunder',css:'#ff5a7a'},thunder:{cn:'雷',weak:'sword',css:'#c9a0ff'},beast:{cn:'兽',weak:null,css:'#c8b08a'},divine:{cn:'神',weak:null,css:'#ffe08a'}};
function elMul(a,b){if(!a||!b||!FOE_EL[b])return 1;if(a===b)return 0.5;if(FOE_EL[b].weak===a)return 1.8;if(b==='divine')return 0.9;return 1}
function hitEnemy(e,mult,o={}){if(!e.alive)return;const em=elMul(o.el||'sword',e.el);const {d,crit}=dmgCalc(mult*em,e.def);e.takeHit(d,o);stageDmg+=d;
  const hp=e.isBoss?e.h3:e.h,ec=o.el&&ELEM[o.el]?ELEM[o.el].css:null;addText(new THREE.Vector3(e.pos.x+rand(-0.3,0.3),hp*rand(0.6,0.95),e.pos.z),(em>1?'克制 ':em<1?'抵抗 ':'')+(crit?'暴击 ':'')+fmt(d),crit||em>1?{size:em>1?32:34,c1:'#fff8c8',c2:em>1?(ec||'#ff8a1a'):'#ff8a1a',dur:1}:{size:o.small?18:24,c1:em<1?'#aaa':'#fff',c2:ec||o.col||'#ffd860'});
  combo++;comboT=2.2;if(!o.quiet)sfx('hit')}
function nearestEnemy(maxD=99,from=hero.pos){let best=null,bd=maxD;for(const e of enemies){if(!e.alive||e.state==='spawn')continue;const d=Math.hypot(e.pos.x-from.x,e.pos.z-from.z)-e.radius;if(d<bd){bd=d;best=e}}return best}
function enemiesNear(r,from=hero.pos){let n=0;for(const e of enemies)if(e.alive&&Math.hypot(e.pos.x-from.x,e.pos.z-from.z)<r+e.radius)n++;return n}
function hurtHero(d,src){if(hero.dead||hero.inv>0||mode!=='battle')return;if(src!=='proj'&&airborne()){if(!hero.dodgeT||hero.dodgeT<stageT){hero.dodgeT=stageT+0.5;addText(new THREE.Vector3(hero.pos.x,2.4,hero.pos.z),'跃避 DODGE',{size:16,c1:'#fff',c2:'#9fe8ff',vy:0.6,dur:0.7})}return}const dmg=Math.max(1,Math.round(d-hero.stats.def*0.6));hero.hp-=dmg;hero.inv=0.4;hero.m.hit('#ff2020',1.2);
  addText(new THREE.Vector3(hero.pos.x,1.6,hero.pos.z),'-'+fmt(dmg),{size:24,c1:'#ffd0d0',c2:'#ff2a3a'});shake(0.18);sfx('hurt',0.1);hurtV=0.5;
  if(hero.state!=='cast'&&hero.state!=='attack'){hero.state='hurt';hero.st=0;hero.dur=0.25}
  if(hero.hp<=0){hero.hp=0;hero.dead=true;hero.state='die';hero.st=0;hero.dur=1.2;slowMo(1);setTimeout(()=>endStage(false),1500)}}
function allyHit(){if(ally)ally.m.hit('#ff4040',0.8)}
function healHero(n){const v=Math.round(n);hero.hp=Math.min(hero.maxHp,hero.hp+v);addText(new THREE.Vector3(hero.pos.x,1.9,hero.pos.z),'+'+fmt(v),{size:22,c1:'#eaffea',c2:'#3adf6a'})}
